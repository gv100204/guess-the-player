# Percorso nel repository: .github/workflows/sync.yml
#
# DUE MODALITÀ
#
# 1) SOLO RICOSTRUZIONE (predefinita, non usa API-Football e non serve
#    l'abbonamento): rigenera il gioco da raw-players.json,
#    wikipedia-check.json e wikipedia-views.json già nel repository e lo
#    pubblica. Parte da sola ogni volta che fai push di uno di quei file, del
#    gioco o dello script, e puoi lanciarla a mano da "Run workflow".
#
# 2) SCARICA DA API-FOOTBALL: la vecchia sincronizzazione, da lanciare a mano
#    scegliendo "scarica-da-api" in "Run workflow". Serve la chiave
#    API_FOOTBALL_KEY e un abbonamento attivo.
#
# Non c'è più nessun lancio programmato: se un giorno vuoi riattivare gli
# aggiornamenti automatici, riaggiungi sotto "on:" un blocco "schedule:" con
# i cron di prima (0 0, 6, 12, 18 * * *).

name: Sync players data

on:
  push:
    branches: [main]
    paths:
      - "raw-players.json"
      - "wikipedia-check.json"
      - "wikipedia-views.json"
      - "indovina-calciatore.html"
      - "sync-players-data.mjs"
  workflow_dispatch:
    inputs:
      modalita:
        description: "solo-ricostruzione = nessuna chiamata API | scarica-da-api = sincronizzazione completa (serve l'abbonamento)"
        type: choice
        options:
          - solo-ricostruzione
          - scarica-da-api
        default: solo-ricostruzione
      leagues:
        description: 'Solo per test (scarica-da-api): id campionati separati da virgola (es. "seriea"). Vuoto = tutti.'
        required: false
        default: ""
      seasonFrom:
        description: "Solo per test (scarica-da-api): prima stagione da spazzolare. Vuoto = quella configurata."
        required: false
        default: ""
      seasonTo:
        description: "Solo per test (scarica-da-api): ultima stagione da spazzolare. Vuoto = quella configurata."
        required: false
        default: ""

# Due run non girano insieme: raw-players.json è un unico file.
concurrency:
  group: sync-players-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Esegue i test prima di tutto
        run: node test-sync-players-data.mjs

      - name: Costruisce i dati del gioco
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # Con un push, o con "solo-ricostruzione", nessuna chiamata API.
          SYNC_BUILD_ONLY: ${{ inputs.modalita == 'scarica-da-api' && '0' || '1' }}
          SYNC_LEAGUES: ${{ inputs.leagues }}
          SYNC_SEASON_FROM: ${{ inputs.seasonFrom }}
          SYNC_SEASON_TO: ${{ inputs.seasonTo }}
        run: node sync-players-data.mjs

      - name: Salva il progresso (raw-players.json, sync-progress.json) su main
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add raw-players.json sync-progress.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare in questo run."
          else
            git commit -m "chore: aggiorna progresso sync [skip ci]"
            for i in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push; then
                  echo "Push riuscito."
                  break
                fi
              else
                echo "Rebase in conflitto: serve intervento manuale, i file di questo run restano solo nei log."
                git rebase --abort || true
                exit 1
              fi
              echo "Tentativo $i non riuscito, riprovo..."
              sleep 5
            done
          fi

      - name: Aggiunge il gioco alla cartella da pubblicare
        run: cp indovina-calciatore.html output/index.html

      - name: Pubblica ./output su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
