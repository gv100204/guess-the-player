# Percorso nel repository: .github/workflows/sync.yml
#
# Gira ogni giorno (e puoi anche lanciarlo a mano dalla scheda "Actions" del
# repository, grazie a workflow_dispatch): esegue prima i test, poi spazzola
# campionati e stagioni ancora da fare (riprendendo da dove si era fermato
# l'ultima volta, grazie a raw-players.json e sync-progress.json che questo
# workflow salva su main a ogni run), poi pubblica il contenuto di ./output/
# (players-data.json, i file per campionato, manifest.json) su GitHub Pages -
# che a quel punto è l'hosting statico che l'app scarica.
#
# Con un roster grande, la prima sincronizzazione completa può richiedere
# diversi run (giorni): è normale, e il progresso non si perde tra un run e
# l'altro. Controlla nei log la riga "Combinazioni campionato-stagione
# completate: X di Y" per capire quanto manca.
#
# Prima di usarlo:
# 1. Nel repository su GitHub: Settings > Secrets and variables > Actions >
#    "New repository secret" > nome API_FOOTBALL_KEY, valore la tua chiave.
# 2. Settings > Pages > Source: "Deploy from a branch", branch "gh-pages".
#    (la branch gh-pages viene creata automaticamente al primo run di questo
#    workflow, non devi crearla a mano)
# 3. Dopo il primo run, i file saranno su:
#    https://<tuo-utente>.github.io/<nome-repo>/manifest.json
#    https://<tuo-utente>.github.io/<nome-repo>/seriea.json  ... ecc.

name: Sync players data

on:
  schedule:
    # Con il tetto di 12.000 chiamate/run (sicuro sotto il limite di 6 ore
    # per job di GitHub Actions, calcolato sul tasso REALE osservato di
    # ~1,37s/chiamata, non solo sulla pausa teorica) e il piano Ultra
    # (75.000/giorno), quattro run/giorno arrivano a ~48.000/giorno - più
    # vicino al vero limite. La protezione "concurrency" qui sotto impedisce
    # comunque le sovrapposizioni anche se un run durasse più del previsto.
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: # bottone "Run workflow" manuale su GitHub
    inputs:
      leagues:
        description: 'Solo per test: id campionati separati da virgola (es. "seriea"). Vuoto = tutti quelli configurati.'
        required: false
        default: ""
      seasonFrom:
        description: "Solo per test: prima stagione da spazzolare (es. 2015). Vuoto = quella configurata nello script."
        required: false
        default: ""
      seasonTo:
        description: "Solo per test: ultima stagione da spazzolare (es. 2016). Vuoto = quella configurata nello script."
        required: false
        default: ""

# Impedisce a due run di questo workflow di girare insieme: se uno schedulato
# scatta mentre un altro run (schedulato o manuale) sta ancora andando, il
# nuovo aspetta in coda invece di partire in parallelo. Necessario perché
# raw-players.json è un unico file: due run che lo modificano insieme
# rischiano di sovrascriversi a vicenda invece di sommare il lavoro.
concurrency:
  group: sync-players-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Esegue i test prima di tutto
        run: node test-sync-players-data.mjs

      - name: Scarica i dati aggiornati da API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SYNC_LEAGUES: ${{ inputs.leagues }}
          SYNC_SEASON_FROM: ${{ inputs.seasonFrom }}
          SYNC_SEASON_TO: ${{ inputs.seasonTo }}
        run: node sync-players-data.mjs

      - name: Salva il progresso (raw-players.json, sync-progress.json) su main
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add raw-players.json sync-progress.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare in questo run."
          else
            git commit -m "chore: aggiorna progresso sync [skip ci]"
            # Se qualcuno ha spinto altre modifiche su main mentre il sync girava
            # (può durare a lungo), il push semplice verrebbe rifiutato. Qui
            # aggiorniamo prima il nostro commit sopra l'ultima versione di main,
            # e riproviamo il push un paio di volte in caso di corse ravvicinate.
            for i in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push; then
                  echo "Push riuscito."
                  break
                fi
              else
                echo "Rebase in conflitto: serve intervento manuale, i file di questo run restano solo nei log."
                git rebase --abort || true
                exit 1
              fi
              echo "Tentativo $i non riuscito, riprovo..."
              sleep 5
            done
          fi

      - name: Pubblica ./output su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
