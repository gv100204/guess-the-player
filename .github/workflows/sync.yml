# Percorso nel repository: .github/workflows/sync.yml
#
# Gira ogni giorno (e puoi anche lanciarlo a mano dalla scheda "Actions" del
# repository, grazie a workflow_dispatch): esegue prima i test, poi spazzola
# campionati e stagioni ancora da fare (riprendendo da dove si era fermato
# l'ultima volta, grazie a raw-players.json e sync-progress.json che questo
# workflow salva su main a ogni run), poi pubblica il contenuto di ./output/
# (players-data.json, i file per campionato, manifest.json) su GitHub Pages -
# che a quel punto è l'hosting statico che l'app scarica.
#
# Con un roster grande, la prima sincronizzazione completa può richiedere
# diversi run (giorni): è normale, e il progresso non si perde tra un run e
# l'altro. Controlla nei log la riga "Combinazioni campionato-stagione
# completate: X di Y" per capire quanto manca.
#
# Prima di usarlo:
# 1. Nel repository su GitHub: Settings > Secrets and variables > Actions >
#    "New repository secret" > nome API_FOOTBALL_KEY, valore la tua chiave.
# 2. Settings > Pages > Source: "Deploy from a branch", branch "gh-pages".
#    (la branch gh-pages viene creata automaticamente al primo run di questo
#    workflow, non devi crearla a mano)
# 3. Dopo il primo run, i file saranno su:
#    https://<tuo-utente>.github.io/<nome-repo>/manifest.json
#    https://<tuo-utente>.github.io/<nome-repo>/seriea.json  ... ecc.

name: Sync players data

on:
  schedule:
    - cron: "0 4 * * *" # ogni giorno alle 04:00 UTC - con un roster grande, riprendere ogni giorno consuma la quota (e completa lo storico) molto più in fretta di una volta a settimana
  workflow_dispatch: # bottone "Run workflow" manuale su GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Esegue i test prima di tutto
        run: node test-sync-players-data.mjs

      - name: Scarica i dati aggiornati da API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node sync-players-data.mjs

      - name: Salva il progresso (raw-players.json, sync-progress.json) su main
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add raw-players.json sync-progress.json
          git diff --staged --quiet || git commit -m "chore: aggiorna progresso sync [skip ci]"
          git push

      - name: Pubblica ./output su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
