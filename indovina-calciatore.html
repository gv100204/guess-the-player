<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Footballer / Indovina il Calciatore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark: #0B1F16; --green: #163A2A; --green-light: #2D6A4F;
    --paper: #F6F3E9; --ink: #14261F; --ink-soft: #46564C;
    --gold: #C9A227; --gold-bright: #E4C34E; --red: #B8433A; --line: rgba(255,255,255,0.14);
  }
  :root:not([data-theme="light"]) {
    --bg: var(--green-dark); --fg: #EFEAD8; --panel: #10281D; --panel-border: rgba(255,255,255,0.10);
    --dossier-bg: #FBF9F1; --dossier-text: var(--ink); --muted: #A9BBAE;
  }
  :root[data-theme="light"] {
    --bg: var(--paper); --fg: var(--ink); --panel: #FFFFFF; --panel-border: rgba(20,38,31,0.12);
    --dossier-bg: #FFFFFF; --dossier-text: var(--ink); --muted: var(--ink-soft);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: var(--paper); --fg: var(--ink); --panel: #FFFFFF; --panel-border: rgba(20,38,31,0.12);
      --dossier-bg: #FFFFFF; --dossier-text: var(--ink); --muted: var(--ink-soft);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px 48px; }
  .scoreboard { background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; color: #EFEAD8; position: relative; overflow: hidden; }
  .scoreboard::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 34px); pointer-events: none; }
  .sb-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; }
  .sb-title { font-family: 'Anton', 'Inter', sans-serif; font-size: 1.3rem; letter-spacing: 0.02em; margin: 0; line-height: 1.1; flex: 1; text-align: center; }
  .settings-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--line); color: #EFEAD8; border-radius: 9px; width: 38px; height: 38px; font-size: 1.05rem; cursor: pointer; flex-shrink: 0; }
  .sb-sub { margin: 4px 0 14px; color: #B9CBBB; font-size: 0.85rem; position: relative; }
  .sb-stats { display: flex; gap: 10px; position: relative; }
  .sb-stat { flex: 1; background: rgba(255,255,255,0.07); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; text-align: center; }
  .sb-stat .num { font-family: 'Anton', sans-serif; font-size: 1.3rem; color: var(--gold-bright); display: block; line-height: 1.1; }
  .sb-stat .lbl { font-size: 0.66rem; color: #A9BBAE; text-transform: uppercase; letter-spacing: 0.06em; }
  .turn-banner { position: relative; background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 0.86rem; font-weight: 700; }
  .turn-banner .rounds { font-weight: 500; color: #B9CBBB; font-size: 0.78rem; display: block; margin-top: 2px; }
  .score-strip { display: flex; flex-wrap: wrap; gap: 8px; position: relative; margin-top: 10px; }
  .score-strip .pchip { background: rgba(255,255,255,0.07); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 0.78rem; font-weight: 600; }
  .score-strip .pchip.turn { background: var(--gold); color: #16261A; border-color: transparent; }
  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 16px; margin-top: 14px; }
  .panel h2 { font-size: 0.95rem; margin: 0 0 10px; font-weight: 700; }
  .panel p.hint { margin: -4px 0 12px; font-size: 0.8rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--panel-border); background: rgba(255,255,255,0.08); color: var(--fg); padding: 7px 13px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; cursor: pointer; user-select: none; }
  .chip.active { background: var(--gold); color: #16261A; border-color: transparent; }
  .chip:active { transform: scale(0.96); }
  .chip-row-actions { display: flex; gap: 8px; margin-top: 10px; }
  .link-btn { background: none; border: none; color: var(--gold-bright); font-size: 0.76rem; font-weight: 700; cursor: pointer; padding: 4px 0; }
  .segmented { display: flex; border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden; }
  .segmented button { flex: 1; background: transparent; border: none; color: var(--fg); padding: 10px 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
  .segmented button.active { background: var(--gold); color: #16261A; }
  .field-label { font-size: 0.78rem; font-weight: 700; margin: 14px 0 8px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--gold); color: #16261A; border: none; border-radius: 10px; padding: 13px 18px; font-size: 0.95rem; font-weight: 800; cursor: pointer; width: 100%; margin-top: 14px; }
  .btn:disabled { opacity: 0.45; }
  .btn:active { transform: scale(0.985); }
  .btn.secondary { background: transparent; color: var(--fg); border: 1px solid var(--panel-border); font-weight: 700; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn-row .btn { margin-top: 0; }
  .player-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .player-row input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--fg); font-size: 0.9rem; font-family: inherit; }
  .player-row button { background: transparent; border: 1px solid var(--panel-border); color: var(--red); border-radius: 8px; width: 38px; font-size: 1rem; cursor: pointer; }
  .dossier { background: var(--dossier-bg); color: var(--dossier-text); border-radius: 12px; padding: 16px; border: 1px solid rgba(0,0,0,0.06); }
  .dossier-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .dossier-head .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--green-light); font-weight: 800; }
  .dossier-head .count { font-size: 0.76rem; color: #7A8B7F; }
  .step-list { list-style: none; margin: 0; padding: 0; }
  .step-list li { padding: 11px 0; border-top: 1px solid rgba(0,0,0,0.07); display: flex; gap: 10px; }
  .step-list li:first-child { border-top: none; }
  .step-list li .yr { flex-shrink: 0; font-family: 'Anton', sans-serif; font-size: 0.8rem; color: var(--green-light); min-width: 78px; }
  .step-list li .info b { display: block; font-size: 0.94rem; }
  .step-list li .info span { font-size: 0.82rem; color: #6E7F73; }
  .extra-hint { font-size: 0.86rem; margin-top: 10px; color: var(--muted); }
  .guess-row { display: flex; gap: 8px; margin-top: 4px; }
  .guess-row input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--fg); font-size: 0.95rem; font-family: inherit; }
  .guess-row input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .feedback { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: rgba(45,106,79,0.18); color: #6FCF97; border: 1px solid rgba(111,207,151,0.3); }
  .feedback.wrong { background: rgba(184,67,58,0.15); color: #F09A93; border: 1px solid rgba(240,154,147,0.3); }
  .feedback.reveal { background: rgba(201,162,39,0.15); color: var(--gold-bright); border: 1px solid rgba(201,162,39,0.3); }
  .empty-state { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 0.9rem; }
  .footer-note { text-align: center; font-size: 0.7rem; color: var(--muted); margin-top: 22px; }
  .handoff { text-align: center; padding: 26px 10px; }
  .handoff .who { font-family: 'Anton', sans-serif; font-size: 1.5rem; margin: 6px 0 4px; }
  .handoff .rounds { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-top: 1px solid var(--panel-border); }
  .leaderboard-row:first-child { border-top: none; }
  .leaderboard-row .pos { font-family: 'Anton', sans-serif; color: var(--gold-bright); width: 28px; }
  .leaderboard-row .name { flex: 1; font-weight: 700; }
  .leaderboard-row .pts { font-weight: 800; }
  .leaderboard-row.winner .name::after { content: " 🏆"; }
</style>
</head>
<body>
<div class="wrap">

  <div class="scoreboard" id="scoreboard">
    <div class="sb-top">
      <button class="settings-btn" id="backBtn" aria-label="Torna al menu" type="button" style="display:none;">←</button>
      <p class="sb-title" id="sbTitle">INDOVINA IL CALCIATORE</p>
      <button class="settings-btn" id="settingsBtn" aria-label="Impostazioni" type="button">⚙</button>
    </div>
    <p class="sb-sub" id="sbSub"></p>
    <div class="sb-stats" id="soloStats">
      <div class="sb-stat"><span class="num" id="sbScore">0</span><span class="lbl" id="lblPoints"></span></div>
      <div class="sb-stat"><span class="num" id="sbStreak">0</span><span class="lbl" id="lblStreak"></span></div>
      <div class="sb-stat"><span class="num" id="sbBest">0</span><span class="lbl" id="lblBest"></span></div>
    </div>
    <div class="turn-banner" id="turnBanner" style="display:none;"></div>
    <div class="score-strip" id="scoreStrip" style="display:none;"></div>
  </div>

  <div class="panel" id="settingsPanel" style="display:none;">
    <h2 id="settingsTitle">Impostazioni</h2>
    <div class="field-label" id="langLabel">Lingua</div>
    <div class="segmented" id="langSegment">
      <button data-lang="it" class="active">Italiano</button>
      <button data-lang="en">English</button>
    </div>
    <div class="field-label" id="includeIncompleteLabel">Carriere incomplete</div>
    <p class="hint" id="includeIncompleteHint"></p>
    <div class="segmented" id="includeIncompleteSegment">
      <button data-include="yes" class="active">Includi</button>
      <button data-include="no">Escludi</button>
    </div>
    <div class="field-label" id="showTrophyYearsLabel">Anni nel palmares</div>
    <p class="hint" id="showTrophyYearsHint"></p>
    <div class="segmented" id="showTrophyYearsSegment">
      <button data-show="yes" class="active">Mostra</button>
      <button data-show="no">Nascondi</button>
    </div>
    <button class="btn secondary" id="closeSettingsBtn">Chiudi</button>
  </div>

  <div class="panel" id="setupPanel">
    <p class="hint" id="dataSourceLabel" style="margin-top:0;">Dati di esempio</p>
    <h2 id="modeTitle">Modalità</h2>
    <div class="segmented" id="contentModeSegment">
      <button data-content="career" class="active"></button>
      <button data-content="palmares"></button>
    </div>

    <div class="field-label" id="playersLabel"></div>
    <div class="segmented" id="playersModeSegment">
      <button data-players="solo" class="active"></button>
      <button data-players="turns"></button>
      <button data-players="party"></button>
    </div>

    <div id="multiSetup" style="display:none;">
      <p class="hint" id="multiSetupHint"></p>
      <div class="field-label" id="whoPlaysLabel"></div>
      <div id="playerInputs"></div>
      <button class="link-btn" id="addPlayerBtn"></button>
      <div class="field-label" id="roundsTurnsLabel" style="display:none;"></div>
      <div class="chips" id="roundsChipsTurns" style="display:none;"></div>
      <div class="field-label" id="roundsPartyLabel" style="display:none;"></div>
      <div class="chips" id="roundsChipsParty" style="display:none;"></div>

      <div class="field-label" id="endConditionLabel"></div>
      <div class="segmented" id="endConditionSegment">
        <button data-end="rounds" class="active"></button>
        <button data-end="score"></button>
      </div>
      <div class="field-label" id="targetScoreLabel" style="display:none;"></div>
      <div class="chips" id="targetScoreChips" style="display:none;"></div>
    </div>

    <div class="field-label" id="revealLabel"></div>
    <div class="segmented" id="modeSegment">
      <button data-mode="step" class="active"></button>
      <button data-mode="all"></button>
    </div>

    <button class="btn secondary" id="openFiltersBtn" style="margin-top:14px; text-align:left; display:flex; flex-direction:column; align-items:flex-start; gap:2px; height:auto; padding:12px 14px;">
      <span id="openFiltersTitle" style="font-weight:800;"></span>
      <span id="openFiltersSummary" style="font-weight:500; font-size:0.78rem; color:var(--muted);"></span>
    </button>

    <button class="btn" id="startBtn" disabled></button>
  </div>

  <div class="panel" id="filtersPanel" style="display:none;">
    <h2 id="filterTitle" style="margin-top:0;"></h2>
    <p class="hint" id="filterHint"></p>
    <div class="chips" id="filterChips"></div>
    <div class="chip-row-actions">
      <button class="link-btn" id="selAll"></button>
      <button class="link-btn" id="selNone"></button>
    </div>

    <div class="field-label" id="matchModeLabel" style="display:none;"></div>
    <div class="segmented" id="matchModeSegment" style="display:none;">
      <button data-match="any" class="active"></button>
      <button data-match="all"></button>
    </div>

    <div class="field-label" id="thresholdLabel"></div>
    <div class="chips" id="thresholdChips"></div>

    <div id="difficultyRow" style="display:none;">
      <div class="field-label" id="difficultyLabel"></div>
      <div class="chips" id="difficultyChips"></div>
    </div>

    <button class="btn" id="closeFiltersBtn"></button>
  </div>

  <div class="panel" id="handoffPanel" style="display:none;">
    <div class="handoff">
      <div style="font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;" id="passPhoneLabel"></div>
      <div class="who" id="handoffName">—</div>
      <div class="rounds" id="handoffRounds"></div>
      <button class="btn" id="handoffReadyBtn"></button>
    </div>
  </div>

  <div class="panel" id="leaderboardPanel" style="display:none;">
    <h2 id="leaderboardTitle"></h2>
    <div id="leaderboardList"></div>
    <button class="btn" id="newMatchBtn"></button>
  </div>

  <div class="panel" id="gamePanel" style="display:none;">
    <div class="dossier" id="dossier">
      <div class="dossier-head">
        <span class="tag" id="dossierTag"></span>
        <span class="count" id="stepCount"></span>
      </div>
      <ul class="step-list" id="stepList"></ul>
      <div class="extra-hint" id="extraHintText" style="display:none;"></div>
    </div>

    <div class="guess-row" id="guessRow" style="margin-top:14px;">
      <input type="text" id="guessInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="btn-row" id="guessBtnRow">
      <button class="btn" id="guessBtn" style="margin-top:0;"></button>
      <button class="btn secondary" id="nextStepBtn"></button>
    </div>
    <div class="btn-row" id="skipRow">
      <button class="btn secondary" id="hintBtn"></button>
      <button class="btn secondary" id="skipBtn"></button>
    </div>

    <div id="partyControls" style="display:none;">
      <div class="field-label" id="partyWhoLabel" style="margin-top:0;"></div>
      <div class="chips" id="partyPickerChips"></div>
      <div class="guess-row" id="partyGuessRow" style="display:none; margin-top:12px;">
        <input type="text" id="partyGuessInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="btn-row">
        <button class="btn" id="partyGuessBtn" style="margin-top:0; display:none;"></button>
        <button class="btn secondary" id="partySkipBtn"></button>
      </div>
    </div>

    <button class="btn secondary" id="newRoundBtn" style="display:none;"></button>

    <div class="feedback" id="feedback"></div>
  </div>

  <p class="footer-note" id="footerNote"></p>
</div>

<script>
(function(){
  "use strict";

  // ==========================================================================
  // Dizionario: ogni stringa dell'interfaccia in italiano e inglese. I dati
  // dei giocatori (carriera, trofei) restano NUMERI E FATTI puri - le frasi
  // si costruiscono qui sotto, al momento di mostrarle, nella lingua scelta.
  // ==========================================================================

  var UI = {
    it: {
      title: "INDOVINA IL CALCIATORE",
      subCareer: "Leggi la carriera, squadra per squadra. Il ruolo non si dice: si intuisce.",
      subPalmares: "Leggi il palmares, trofeo dopo trofeo. Il ruolo non si dice: si intuisce.",
      points: "Punti", streak: "Serie", best: "Record",
      settingsTitle: "Impostazioni", language: "Lingua", close: "Chiudi",
      includeIncompleteLabel: "Carriere incomplete",
      includeIncompleteHint: "Alcuni giocatori hanno solo le tappe scoperte finora: il recupero della carriera intera è ancora in corso. Utile solo per testare i dati, non per giocare davvero.",
      includeYes: "Includi", includeNo: "Escludi",
      showTrophyYearsLabel: "Anni nel palmares",
      showTrophyYearsHint: "Mostra l'anno o l'edizione di ogni trofeo vinto. Disattiva per una sfida più difficile, senza quell'indizio.",
      showYes: "Mostra", showNo: "Nascondi",
      backToMenu: "Torna al menu", confirmExit: "Vuoi tornare al menu? La partita in corso andrà persa.",
      modeTitle: "Modalità", career: "Carriera", palmares: "Palmares",
      players: "Giocatori", solo: "Singolo", turns: "A turni", party: "Tutti insieme",
      multiHintTurns: "Si passa il telefono: ogni giocatore fa il suo turno e accumula punti.",
      multiHintParty: "Tutti guardano lo stesso schermo: quando qualcuno indovina ad alta voce, premi \"Indovinato!\" e scegli chi.",
      whoPlays: "Chi gioca", addPlayer: "+ Aggiungi giocatore",
      roundsPerPlayer: "Manche per giocatore", each: "a testa",
      totalRounds: "Numero di round totali", roundsWord: "round",
      filterTitle: "In quale campionato deve aver militato?",
      filterHint: "Scegli uno o più campionati: il giocatore estratto deve averci giocato, sopra la soglia di presenze scelta sotto. Il resto della sua carriera non conta.",
      selectAll: "Seleziona tutti", deselectAll: "Deseleziona tutti",
      mustHavePlayed: "Deve aver giocato in...", atLeastOne: "Almeno uno di questi", allOfThese: "Tutti questi",
      minApps: "Presenze minime nel campionato", atLeast1: "Almeno 1",
      difficulty: "Difficoltà (in base al numero di trofei)",
      diffAny: "Qualsiasi", diffEasy: "Facile", diffMedium: "Media", diffHard: "Difficile",
      matchFilters: "Filtri partita", close2: "Fatto",
      filtersSummaryNone: "Nessun campionato selezionato",
      filtersSummary: function(n, thr){ return n + (n === 1 ? " campionato" : " campionati") + " · presenze minime " + thr; },
      whenMatchEnds: "Quando finisce la partita", fixedRounds: "Round fissi", firstToScore: "Primo al punteggio",
      targetScore: "Punteggio da raggiungere", pointsWord: "punti",
      targetLabel: function(n){ return "Obiettivo: " + n + " punti"; },
      revealCareer: "Come rivelare la carriera", revealPalmares: "Come rivelare il palmares",
      stepByStep: "Passo dopo passo", allAtOnce: "Tutta insieme",
      selectLeaguePrompt: "Seleziona almeno un campionato", startGame: "Inizia la partita",
      passThePhone: "Passa il telefono a", ready: "Pronto, tocca a me",
      round: "Manche", of: "di",
      finalLeaderboard: "Classifica finale", newGame: "Nuova partita",
      careerTag: "Carriera del giocatore", palmaresTag: "Palmares del giocatore",
      stageOne: "tappa", stageMany: "tappe", clueOne: "indizio", clueMany: "indizi", outOf: "su",
      guessPlaceholder: "Scrivi il nome del calciatore...",
      guess: "Indovina", nextStage: "Prossima tappa", nextClue: "Prossimo indizio",
      hintBtn: "Indizio: nazionalità (−20)", hintUsed: "Indizio usato",
      skipReveal: "Salta / Rivela", nextPlayer: "Prossimo giocatore", nextRound: "Prossimo round",
      whoAnswers: "Chi vuole rispondere?", confirmAnswer: "Conferma risposta", nobodyGot: "Nessuno indovina",
      correctFeedback: function(name, pts){ return "Esatto! Era " + name + ". +" + pts + " punti."; },
      wrongFeedback: "Non è lui. Prova un altro nome o chiedi un altro indizio.",
      revealFeedback: function(name, nat){ return "Era " + name + " (" + nat + ")."; },
      partyCorrect: function(player, name){ return "Punto per " + player + "! Era " + name + "."; },
      partyWrong: function(player){ return player + " ha sbagliato. Un altro vuole provare?"; },
      partyReveal: function(name){ return "Nessuno ha indovinato. Era " + name + "."; },
      nationalityLine: function(nat){ return "Nazionalità: " + nat; },
      emptyPool: "Nessun calciatore corrisponde ai filtri scelti. Allarga i filtri.",
      restart: " · ripartiamo il giro",
      appsGoals: function(a, g){ return a + " presenze, " + g + " gol"; },
      appsConceded: function(a, g){ return a + " presenze, " + g + " gol subiti"; },
      appsOnly: function(a){ return a + " presenze"; },
      footer: "Prototipo · presenze, gol e palmares sono dati di esempio, da sostituire con statistiche reali verificate",
      champion: function(n){ return "Campione di " + n; },
      championMulti: function(c, n){ return c + " volte campione di " + n; },
      titleWithYear: function(n, y){ return "1 titolo: " + n + " (" + y + ")"; }
    },
    en: {
      title: "GUESS THE FOOTBALLER",
      subCareer: "Read the career, club by club. The role is never named — you have to guess it.",
      subPalmares: "Read the honours, one line at a time. The role is never named — you have to guess it.",
      points: "Points", streak: "Streak", best: "Best",

  // Dati reali: manifest + shard per campionato, prodotti dallo script di
  // sync automatico. Si scaricano una volta, si mettono in cache (funziona
  // anche offline dopo il primo download), e si aggiornano solo se la
  // versione del manifest è cambiata.
  //
  // ATTENZIONE - dove funziona davvero: questa pagina, quando è pubblicata
  // come artifact di Claude, non può fare fetch verso siti esterni (regola
  // di sicurezza della piattaforma) - qui dentro il fetch fallirà sempre e

  // download, apri il file .html scaricato direttamente in un browser vero
  // (Safari/Chrome sul tuo Mac, non tramite il link di Claude): lì il fetch
  // funziona normalmente, senza questa restrizione.
  // ==========================================================================

  var MANIFEST_URL = "https://gv100204.github.io/guess-the-player/manifest.json";
  var REAL_CACHE_KEY = "indovina_calciatore_real_data_v1";
  var realShardsByLeague = {}; // leagueId -> array di giocatori (forma identica a DEMO_PLAYERS)
  var realDataStatus = { loaded: false, version: null, leaguesLoaded: 0, leaguesTotal: 0, error: null };

  function loadRealCache(){
    var cached = safeGet(REAL_CACHE_KEY);
    if (cached && cached.shards) realShardsByLeague = cached.shards;
    return cached;
  }
  function saveRealCache(version){
    safeSet(REAL_CACHE_KEY, { version: version, shards: realShardsByLeague });
  }

  async function fetchJson(url){
    var res = await fetch(url, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function loadRealData(){
    var cached = loadRealCache();
    try {
      var manifest = await fetchJson(MANIFEST_URL);
      var leagueIds = Object.keys(manifest.leagues || {});
      realDataStatus.leaguesTotal = leagueIds.length;

      var needsSave = false;
      for (var i = 0; i < leagueIds.length; i++){
        var id = leagueIds[i];
        var info = manifest.leagues[id];
        var haveFresh = cached && cached.version === manifest.version && realShardsByLeague[id];
        if (haveFresh){
          realDataStatus.leaguesLoaded++;
          continue;
        }
        try {
          var shard = await fetchJson(MANIFEST_URL.replace("manifest.json", info.file));
          realShardsByLeague[id] = shard.players || [];
          realDataStatus.leaguesLoaded++;
          needsSave = true;
        } catch (shardErr) {
          console.warn("Shard " + id + " non scaricato: " + shardErr.message);
        }
      }
      realDataStatus.loaded = realDataStatus.leaguesLoaded > 0;
      realDataStatus.version = manifest.version;
      if (needsSave) saveRealCache(manifest.version);
    } catch (err) {
      realDataStatus.error = err.message;
      // Nessun manifest raggiungibile: se avevamo comunque una cache da un
      // download riuscito in passato, la usiamo lo stesso (meglio dati un
      // po' vecchi che nessun dato reale).
      if (cached && cached.shards) {
        realDataStatus.loaded = Object.keys(cached.shards).length > 0;
        realDataStatus.version = cached.version;
      }
    }
    updateDataSourceLabel();
  }

  function updateDataSourceLabel(){
    if (!el.dataSourceLabel) return;
    if (realDataStatus.loaded){
      el.dataSourceLabel.textContent = (lang === "it" ? "Dati reali" : "Real data") +
        " (" + realDataStatus.version + ") · " + realDataStatus.leaguesLoaded + "/" + realDataStatus.leaguesTotal;
    } else {
      el.dataSourceLabel.textContent = lang === "it" ? "Dati di esempio (dati reali non raggiungibili)" : "Sample data (real data unreachable)";
    }
  }

  /** Tutti i giocatori disponibili per un campionato: reali se li abbiamo già scaricati, altrimenti quelli di esempio. */
  function playersForLeague(leagueId){
    if (realShardsByLeague[leagueId]) return realShardsByLeague[leagueId];
    return DEMO_PLAYERS.filter(function(p){ return p.career.some(function(c){ return c.league === leagueId; }); });
  }
  /** Unione, senza doppioni, dei giocatori di tutti i campionati passati (un giocatore può comparire in più shard). */
  function candidatePool(leagueIds){
    var seen = {};
    var out = [];
    leagueIds.forEach(function(lid){
      playersForLeague(lid).forEach(function(p){
        var key = p.id || p.name;
        if (seen[key]) return;
        seen[key] = true;
        out.push(p);
      });
    });
    return out;
  }

  function renderFilterChips(){
    el.filterChips.innerHTML = "";
    Object.keys(getActiveCatalog()).forEach(function(id){

      chip.className = "chip" + (selectedLeagues.has(id) ? " active" : "");
      chip.textContent = leagueLabel(id, lang);
      chip.type = "button";
      chip.addEventListener("click", function(){
        if (selectedLeagues.has(id)) selectedLeagues.delete(id); else selectedLeagues.add(id);
        renderFilterChips();
      });
      el.filterChips.appendChild(chip);
    });
    updateStartState();

      chip.addEventListener("click", function(){ threshold = v; renderThresholdChips(); updateStartState(); });
      el.thresholdChips.appendChild(chip);

  function getPool(){
    var ids = Array.from(selectedLeagues);
    return candidatePool(ids).filter(function(p){
      function matchesLeague(id){
        return p.career.some(function(c){ return c.league === id && c.apps >= threshold; });
      }
      var leagueOk = (matchMode === "all" && ids.length > 1) ? ids.every(matchesLeague) : ids.some(matchesLeague);
      if (!leagueOk) return false;
      if (!includeIncomplete && p.careerComplete === false) return false;
      if (contentMode === "palmares"){
        var n = p.trophies ? p.trophies.length : 0;
        if (n === 0) return false;
        if (difficulty === "easy" && n < 5) return false;
        if (difficulty === "medium" && (n < 3 || n > 4)) return false;
        if (difficulty === "hard" && n > 2) return false;
      }
      return true;
    });
  }

  function normalize(s){
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, "").trim();
  }

  // Nome da mostrare: quello pubblico/comune preso da Wikipedia
  // (displayName, es. "Pepe Reina") se lo abbiamo, altrimenti il nome
  // legale completo salvato nei dati grezzi (name).
  function displayNameOf(p){
    return (p && p.displayName) || (p && p.name) || "";
  }

  // La risposta scritta viene accettata se combacia con il nome legale
  // O col nome pubblico (quando sono diversi) - senza questo, scrivere il
  // nome con cui il giocatore è davvero conosciuto (es. "Lucas Leiva"
  // invece del nome legale "Lucas Pezzini Leiva") veniva rifiutato.
  function guessMatches(p, guessNormalized){
    var candidates = [p.name];
    if (p.displayName && p.displayName !== p.name) candidates.push(p.displayName);
    return candidates.some(function(full){
      var answer = normalize(full);
      if (guessNormalized === answer) return true;
      if (guessNormalized.length <= 2) return false;
      // Qualunque pezzo CONSECUTIVO del nome è accettato (non solo una
      // parola sola, non solo l'inizio) - tranne il nome intero (già
      // controllato sopra) e il solo primo nome da solo (troppo generico,
      // rischia di far indovinare per caso con un nome comune). Bug reali
      // trovati: "Zúñiga" dentro "Juan Camilo Zúñiga Mosquera" (un
      // cognome in mezzo, non l'ultimo), "Alex Sandro" dentro "Alex
      // Sandro Lobo Silva" (primi due nomi insieme, non un cognome
      // singolo).
      var allWords = full.split(" ");
      for (var start = 0; start < allWords.length; start++){
        for (var end = start + 1; end <= allWords.length; end++){
          if (start === 0 && end === allWords.length) continue; // nome intero, già gestito
          if (start === 0 && end === 1) continue; // solo primo nome da solo: troppo generico
          if (normalize(allWords.slice(start, end).join(" ")) === guessNormalized) return true;
        }
      }
      return false;
    });
  }

  function earliestYear(tr){
    if (!tr.seasons || tr.seasons.length === 0) return Infinity; // nessun anno noto: in fondo, non prima
    var years = tr.seasons.map(function(s){
      var m = String(s).match(/\d{4}/);
      return m ? Number(m[0]) : Infinity;
    });
    return Math.min.apply(null, years);
  }

  function buildSteps(p){
    if (contentMode === "career"){
      return p.career.map(function(c){
        var sub = p.isGK
          ? (c.goals == null ? t("appsOnly")(c.apps) : t("appsConceded")(c.apps, c.goals))
          : t("appsGoals")(c.apps, c.goals);
        return { left: c.years, title: c.club, sub: sub };
      });
    }
    // Ordine cronologico: il trofeo vinto per la prima volta più presto va
    // per primo, col conteggio totale (comprese le vittorie successive) -
    // non l'ordine in cui l'API li restituisce, che non segue nessuna
    // logica temporale.
    var sortedTrophies = p.trophies.slice().sort(function(a, b){
      return earliestYear(a) - earliestYear(b);
    });
    return sortedTrophies.map(function(tr){
      var name = compLabel(tr.comp, lang);
      if (tr.country) name = name + " (" + tr.country + ")"; // competizione non riconosciuta: il paese la disambigua (es. "Super Cup" esiste in più nazioni)
      var title;
      if (tr.count > 1) title = t("championMulti")(tr.count, name);
      else if (showTrophyYears && tr.seasons && tr.seasons[0]) title = t("titleWithYear")(name, tr.seasons[0]);
      else title = t("champion")(name);
      return { left: name, title: title, sub: "" };
    });
  }

  function startRound(){
    state.pool = getPool();
    hideFeedback();
    el.guessInput.value = "";

    if (state.pool.length === 0){
      el.stepList.innerHTML = '<li class="empty-state">' + t("emptyPool") + '</li>';
      el.stepCount.textContent = "";
      el.guessInput.disabled = true; el.guessBtn.disabled = true; el.nextStepBtn.disabled = true; el.hintBtn.disabled = true; el.skipBtn.disabled = true;
      el.partySkipBtn.disabled = true;
      return;
    }

    var available = state.pool.filter(function(p){ return !usedPlayerNames.has(p.name); });
    var repeatedCycle = false;
    if (available.length === 0){ usedPlayerNames.clear(); available = state.pool; repeatedCycle = true; }
    var idx = Math.floor(Math.random() * available.length);
    state.current = available[idx];
    usedPlayerNames.add(state.current.name);
    state.currentSteps = buildSteps(state.current);
    state.stepsShown = revealMode === "all" ? state.currentSteps.length : 1;
    renderSteps();
    if (revealMode === "step" && state.stepsShown >= state.currentSteps.length) el.nextStepBtn.disabled = true;
    if (repeatedCycle && state.pool.length > 1) el.stepCount.textContent += t("restart");
  }

  function computeScore(){
    var base = 110;
    var stepsPenalty = revealMode === "step" ? (state.stepsShown - 1) * 12 : 0;
    var wrongPenalty = state.wrongGuesses * 15;
    var hintPenalty = state.hintUsed ? 20 : 0;
    return Math.max(10, base - stepsPenalty - wrongPenalty - hintPenalty);
  }
  function endRound(won, points){
    state.resolved = true;
    el.guessInput.disabled = true; el.guessBtn.disabled = true; el.nextStepBtn.disabled = true; el.hintBtn.disabled = true; el.skipBtn.disabled = true;
    if (matchType === "turns"){
      if (won) matchPlayers[turnIndex].score += points;
      updateScoreboard();
      window.setTimeout(advanceMatch, 550);
    } else {
      if (won && state.score > state.best){
        state.best = state.score;
        safeSet("indovina_calciatore_best_v5", { best: state.best });
      }
      updateScoreboard();
      el.newRoundBtn.style.display = "block";
      el.newRoundBtn.textContent = t("nextPlayer");
    }
  }
  function submitGuess(){
    if (!state.current || state.resolved) return;
    var guess = normalize(el.guessInput.value);
    if (!guess) return;
    if (guessMatches(state.current, guess)){
      var points = computeScore();
      if (matchType === "solo"){ state.score += points; state.streak += 1; }
      showFeedback("correct", t("correctFeedback")(displayNameOf(state.current), points));
      endRound(true, points);
    } else {
      state.wrongGuesses += 1;
      if (matchType === "solo") state.streak = 0;
      showFeedback("wrong", t("wrongFeedback"));
      updateScoreboard();
    }
  }
  function skipRound(){
    if (!state.current || state.resolved) return;
    if (matchType === "solo") state.streak = 0;
    state.stepsShown = state.currentSteps.length;
    renderSteps();
    showFeedback("reveal", t("revealFeedback")(displayNameOf(state.current), nationalityOf(state.current)));
    endRound(false, 0);
  }
  function nextStep(){
    if (!state.current || state.resolved || revealMode !== "step") return;
    if (state.stepsShown < state.currentSteps.length){
      state.stepsShown += 1;
      renderSteps();
      hideFeedback();
      if (state.stepsShown >= state.currentSteps.length) el.nextStepBtn.disabled = true;
    }
  }
  function useHint(){
    if (!state.current || state.resolved || state.hintUsed) return;
    state.hintUsed = true;
    el.extraHintText.style.display = "block";
    el.extraHintText.textContent = t("nationalityLine")(nationalityOf(state.current));
    el.hintBtn.disabled = true;
    el.hintBtn.textContent = t("hintUsed");
  }
  function matchShouldEnd(){
    if (endCondition === "score"){
      var target = matchType === "party" ? targetScoreParty : targetScoreTurns;
      return matchPlayers.some(function(p){ return p.score >= target; }) || roundsDone >= SAFETY_MAX_ROUNDS;
    }
    return roundsDone >= totalRounds;
  }
  function roundLabel(){
    if (endCondition === "score"){
      var target = matchType === "party" ? targetScoreParty : targetScoreTurns;
      return t("round") + " " + (roundsDone + 1) + " · " + t("targetLabel")(target);
    }
    return t("round") + " " + (roundsDone + 1) + " " + t("of") + " " + totalRounds;
  }

  function advanceMatch(){
    roundsDone += 1;
    if (matchShouldEnd()){ showLeaderboard(); return; }
    turnIndex = (turnIndex + 1) % matchPlayers.length;
    showHandoff();
  }
  function showHandoff(){
    showPanel("handoff");
    var p = matchPlayers[turnIndex];
    el.handoffName.textContent = p.name;
    el.handoffRounds.textContent = roundLabel();
  }

  var partyActiveResponder = -1;
  function renderPartyPickerChips(){
    el.partyPickerChips.innerHTML = "";
    if (!matchPlayers) return;
    matchPlayers.forEach(function(mp, i){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (i === partyActiveResponder ? " active" : "");
      chip.textContent = mp.name;
      chip.addEventListener("click", function(){ selectResponder(i); });
      el.partyPickerChips.appendChild(chip);
    });
  }
  function selectResponder(idx){
    if (!state.current || state.resolved) return;
    partyActiveResponder = idx;
    renderPartyPickerChips();
    el.partyGuessRow.style.display = "flex";
    el.partyGuessBtn.style.display = "block";
    el.partyGuessInput.value = "";
    el.partyGuessInput.focus();
    hideFeedback();
  }
  function submitPartyGuess(){
    if (!state.current || state.resolved || partyActiveResponder < 0) return;
    var guess = normalize(el.partyGuessInput.value);
    if (!guess) return;
    if (guessMatches(state.current, guess)){
      resolvePartyRound(partyActiveResponder);
    } else {
      showFeedback("wrong", t("partyWrong")(matchPlayers[partyActiveResponder].name));
      el.partyGuessInput.value = "";
      el.partyGuessInput.focus();
    }
  }
  function resolvePartyRound(awardIdx){
    if (state.resolved) return;
    state.resolved = true;
    state.stepsShown = state.currentSteps.length;
    renderSteps();
    el.nextStepBtn.disabled = true; el.hintBtn.disabled = true;
    el.partySkipBtn.disabled = true;
    el.partyGuessRow.style.display = "none";
    el.partyGuessBtn.style.display = "none";
    el.partyPickerChips.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
    if (awardIdx >= 0){
      matchPlayers[awardIdx].score += 1;
      showFeedback("correct", t("partyCorrect")(matchPlayers[awardIdx].name, displayNameOf(state.current)));
    } else {
      showFeedback("reveal", t("partyReveal")(displayNameOf(state.current)));
    }
    updateScoreboard();
    el.newRoundBtn.style.display = "block";
    el.newRoundBtn.textContent = t("nextRound");
  }
  function advanceParty(){
    roundsDone += 1;
    if (matchShouldEnd()){ showLeaderboard(); return; }
    startRound();
  }

  function showLeaderboard(){
    showPanel("leaderboard");
    var sorted = matchPlayers.slice().sort(function(a, b){ return b.score - a.score; });
    var top = sorted.length ? sorted[0].score : 0;
    el.leaderboardList.innerHTML = "";
    sorted.forEach(function(p, i){
      var row = document.createElement("div");
      row.className = "leaderboard-row" + (p.score === top ? " winner" : "");
      row.innerHTML = '<span class="pos">' + (i + 1) + '</span><span class="name">' + p.name + '</span><span class="pts">' + p.score + '</span>';
      el.leaderboardList.appendChild(row);
    });
  }

  el.startBtn.addEventListener("click", function(){
    usedPlayerNames.clear();
    if (matchType === "turns"){
      var namesT = getPlayerInputValues().map(function(n, i){ return n.trim() || ((lang === "it" ? "Giocatore " : "Player ") + (i + 1)); });
      matchPlayers = namesT.map(function(n){ return { name: n, score: 0 }; });
      totalRounds = matchPlayers.length * roundsPerPlayer;
      turnIndex = 0; roundsDone = 0;
      showHandoff();
    } else if (matchType === "party"){
      var namesP = getPlayerInputValues().map(function(n, i){ return n.trim() || ((lang === "it" ? "Giocatore " : "Player ") + (i + 1)); });
      matchPlayers = namesP.map(function(n){ return { name: n, score: 0 }; });
      totalRounds = partyRoundsTotal;
      roundsDone = 0;
      startRound();
    } else {
      matchPlayers = null;
      startRound();
    }
  });
  el.handoffReadyBtn.addEventListener("click", startRound);
  el.newMatchBtn.addEventListener("click", function(){ matchPlayers = null; showPanel("setup"); });
  el.guessBtn.addEventListener("click", submitGuess);
  el.guessInput.addEventListener("keydown", function(e){ if (e.key === "Enter") submitGuess(); });
  el.nextStepBtn.addEventListener("click", nextStep);
  el.hintBtn.addEventListener("click", useHint);
  el.skipBtn.addEventListener("click", skipRound);
  el.partyGuessBtn.addEventListener("click", submitPartyGuess);
  el.partyGuessInput.addEventListener("keydown", function(e){ if (e.key === "Enter") submitPartyGuess(); });
  el.partySkipBtn.addEventListener("click", function(){ resolvePartyRound(-1); });
  el.newRoundBtn.addEventListener("click", function(){
    if (matchType === "party") advanceParty();
    else startRound();
  });

  applyStaticLabels();
  loadRealCache();
  updateDataSourceLabel();
  loadRealData();
})();
</script>
</body>
</html>
